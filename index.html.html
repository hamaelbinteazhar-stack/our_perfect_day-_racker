<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perfect Day 🌟</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card-bg: #ffffff;
    --title-fg: #1e293b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 20px 10px;
    background: var(--bg);
    font-family: Arial, "Segoe UI", sans-serif;
    transition: background 0.3s ease;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 480px;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .date-label {
    font-size: 13px;
    font-weight: bold;
    color: #64748b;
  }

  .streak-badge {
    font-size: 13px;
    font-weight: bold;
    color: #b45309;
    background: #fef3c7;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #f3d489;
    white-space: nowrap;
  }

  /* Title */
  .main-title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: var(--title-fg);
    margin: 4px 0 8px 0;
    transition: color 0.3s ease;
  }

  /* Quote */
  .quote-frame {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .quote-label {
    flex: 1;
    font-size: 12px;
    font-style: italic;
    color: #475569;
  }

  .btn-quote {
    border: none;
    background: #e2e8f0;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-quote:hover { background: #cbd5e1; }

  /* Face card */
  .face-card {
    background: var(--card-bg);
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    margin-bottom: 10px;
    transition: background 0.3s ease;
  }

  .emoji-label {
    font-size: 56px;
    line-height: 1;
  }

  .message-label {
    font-size: 14px;
    font-weight: bold;
    margin-top: 4px;
    color: #64748b;
  }

  .progress-label {
    font-size: 12px;
    font-weight: bold;
    color: #94a3b8;
    margin-top: 2px;
  }

  .sparkle-label {
    font-size: 14px;
    color: #d97706;
    margin-top: 4px;
    min-height: 18px;
    font-weight: bold;
  }

  /* Goals header */
  .goals-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .goals-header-text {
    font-size: 13px;
    font-weight: bold;
    color: #334155;
  }

  .btn-add-goal {
    background: #e0e7ff;
    color: #4338ca;
    border: 1px solid #c7d2fe;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 10px;
    cursor: pointer;
  }
  .btn-add-goal:hover { background: #c7d2fe; }

  /* Goals list */
  .goals-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
  }

  .goal-row {
    display: flex;
    align-items: center;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .goal-row.checked {
    background: #f0fdf4;
    border-color: #dcfce7;
  }

  .goal-icon {
    font-size: 20px;
    margin-right: 10px;
    flex-shrink: 0;
  }

  .goal-text-frame {
    flex: 1;
    min-width: 0;
  }

  .goal-title {
    font-size: 14px;
    font-weight: bold;
    color: #1e293b;
    display: block;
  }

  .goal-row.checked .goal-title {
    color: #94a3b8;
    text-decoration: line-through;
  }

  .goal-sub {
    font-size: 11px;
    color: #64748b;
    display: block;
    margin-top: 1px;
  }

  .goal-checkbox {
    width: 20px;
    height: 20px;
    margin-left: 8px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .goal-delete {
    color: #cbd5e1;
    font-weight: bold;
    font-size: 12px;
    margin-left: 10px;
    padding: 2px 4px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .goal-delete:hover { color: #ef4444; }

  /* Gratitude card */
  .gratitude-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  .gratitude-title {
    font-size: 12px;
    font-weight: bold;
    color: #78350f;
    display: block;
    margin-bottom: 5px;
  }

  .gratitude-entry {
    width: 100%;
    font-size: 13px;
    padding: 7px 8px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 5px;
    font-family: inherit;
  }

  /* Bottom buttons */
  .btn-frame {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }

  .check-btn {
    flex: 1;
    background: #3b82f6;
    color: white;
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
  }
  .check-btn:hover { background: #2563eb; }

  .reset-btn {
    background: #e2e8f0;
    color: #475569;
    font-size: 13px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
  }
  .reset-btn:hover { background: #cbd5e1; }

  /* Gold celebration mode */
  body.gold-mode {
    background: #fef3c7;
  }
  body.gold-mode .face-card,
  body.gold-mode .gratitude-card {
    background: #fffbeb;
  }
  body.gold-mode .main-title {
    color: #92400e;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.35s ease; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal-box {
    background: white;
    border-radius: 12px;
    padding: 20px;
    max-width: 380px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .modal-title {
    font-size: 16px;
    font-weight: bold;
    margin: 0 0 10px 0;
    color: #1e293b;
  }

  .modal-body {
    font-size: 13px;
    color: #334155;
    white-space: pre-wrap;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .modal-input {
    width: 100%;
    padding: 8px;
    font-size: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    margin-bottom: 10px;
    font-family: inherit;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .modal-btn {
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .modal-btn.primary {
    background: #3b82f6;
    color: white;
  }
  .modal-btn.primary:hover { background: #2563eb; }

  .modal-btn.secondary {
    background: #e2e8f0;
    color: #475569;
  }
  .modal-btn.secondary:hover { background: #cbd5e1; }
</style>
</head>
<body>

<div class="app">

  <div class="top-bar">
    <div class="date-label" id="dateLabel">📅 </div>
    <div class="streak-badge" id="streakBadge">🔥 0 Day Streak</div>
  </div>

  <div class="main-title" id="mainTitle">✨ PERFECT DAY ✨</div>

  <div class="quote-frame">
    <div class="quote-label" id="quoteLabel"></div>
    <button class="btn-quote" id="btnQuote" title="New quote">🎲</button>
  </div>

  <div class="face-card" id="faceCard">
    <div class="emoji-label" id="emojiLabel">😐</div>
    <div class="message-label" id="messageLabel">Check off your goals to make me happy!</div>
    <div class="progress-label" id="progressLabel">0 of 6 completed (0%)</div>
    <div class="sparkle-label" id="sparkleLabel"></div>
  </div>

  <div class="goals-header">
    <div class="goals-header-text">📋 Today's Daily Habits:</div>
    <button class="btn-add-goal" id="btnAddGoal">➕ Add Goal</button>
  </div>

  <div class="goals-box" id="goalsBox"></div>

  <div class="gratitude-card">
    <span class="gratitude-title">💛 One thing I am grateful for today:</span>
    <input type="text" class="gratitude-entry" id="gratitudeEntry" placeholder="Type here...">
  </div>

  <div class="btn-frame">
    <button class="check-btn" id="checkBtn">🔍 Check My Day</button>
    <button class="reset-btn" id="resetBtn">↺ Reset</button>
  </div>

</div>

<!-- Modal for alerts / prompts / confirms -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <input type="text" class="modal-input" id="modalInput" style="display:none;">
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
(function () {
  // ---------- Data ----------
  const DEFAULT_GOALS = [
    { icon: "💧", text: "Drink Water", sub: "Drink at least 2 liters of water" },
    { icon: "🏃", text: "Exercise", sub: "Move or exercise for 30 minutes" },
    { icon: "📖", text: "Read", sub: "Read 20 pages of a good book" },
    { icon: "😴", text: "Sleep 8 hrs", sub: "Get a full 8 hours of rest" },
    { icon: "📵", text: "No Phone Before Bed", sub: "Put phone away 30 min before bed" },
    { icon: "📞", text: "Call a Friend", sub: "Call or text a friend to say hi!" },
  ];

  const QUOTES = [
    "✨ Small steps every single day lead to giant happiness! ✨",
    "🌟 You have the power to make today super amazing! 🌟",
    "💪 Consistency is your secret superpower! Keep going! 💪",
    "🌱 Plant good habits today, harvest happiness tomorrow! 🌱",
    "🚀 Every single checkmark is a win for your future self! 🚀",
    "🌈 Today is a fresh blank page, make it a masterpiece! 🌈",
    "☀️ Keep your face toward the sunshine and shadows fall behind! ☀️"
  ];

  const SPARKLE_PATTERNS = [
    "✨ 🌟 🎊 PERFECT DAY UNLOCKED 🎊 🌟 ✨",
    "⭐ ✨ 🥳 PERFECT DAY UNLOCKED 🥳 ✨ ⭐",
    "💫 🌟 🎉 PERFECT DAY UNLOCKED 🎉 🌟 💫",
    "🌟 ⭐ ✨ PERFECT DAY UNLOCKED ✨ ⭐ 🌟"
  ];

  // In-memory state
  const state = {
    goals: JSON.parse(JSON.stringify(DEFAULT_GOALS)),
    checked: DEFAULT_GOALS.map(() => false),
    streakCount: 0,
    lastPerfectDate: null,
    currentQuote: QUOTES[Math.floor(Math.random() * QUOTES.length)],
    isGoldMode: false,
    sparkleTimer: null,
    sparkleStep: 0
  };

  // ---------- Elements ----------
  const el = {
    dateLabel: document.getElementById("dateLabel"),
    streakBadge: document.getElementById("streakBadge"),
    mainTitle: document.getElementById("mainTitle"),
    quoteLabel: document.getElementById("quoteLabel"),
    btnQuote: document.getElementById("btnQuote"),
    faceCard: document.getElementById("faceCard"),
    emojiLabel: document.getElementById("emojiLabel"),
    messageLabel: document.getElementById("messageLabel"),
    progressLabel: document.getElementById("progressLabel"),
    sparkleLabel: document.getElementById("sparkleLabel"),
    btnAddGoal: document.getElementById("btnAddGoal"),
    goalsBox: document.getElementById("goalsBox"),
    gratitudeEntry: document.getElementById("gratitudeEntry"),
    checkBtn: document.getElementById("checkBtn"),
    resetBtn: document.getElementById("resetBtn"),
    modalOverlay: document.getElementById("modalOverlay"),
    modalTitle: document.getElementById("modalTitle"),
    modalBody: document.getElementById("modalBody"),
    modalInput: document.getElementById("modalInput"),
    modalActions: document.getElementById("modalActions"),
  };

  // ---------- Modal helpers ----------
  function closeModal() {
    el.modalOverlay.classList.remove("open");
    el.modalInput.style.display = "none";
    el.modalInput.value = "";
  }

  function showInfo(title, body) {
    el.modalTitle.textContent = title;
    el.modalBody.textContent = body;
    el.modalInput.style.display = "none";
    el.modalActions.innerHTML = "";
    const okBtn = document.createElement("button");
    okBtn.className = "modal-btn primary";
    okBtn.textContent = "OK";
    okBtn.onclick = closeModal;
    el.modalActions.appendChild(okBtn);
    el.modalOverlay.classList.add("open");
  }

  function showConfirm(title, body, onYes) {
    el.modalTitle.textContent = title;
    el.modalBody.textContent = body;
    el.modalInput.style.display = "none";
    el.modalActions.innerHTML = "";
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "modal-btn secondary";
    cancelBtn.textContent = "Cancel";
    cancelBtn.onclick = closeModal;
    const yesBtn = document.createElement("button");
    yesBtn.className = "modal-btn primary";
    yesBtn.textContent = "Yes";
    yesBtn.onclick = () => { closeModal(); onYes(); };
    el.modalActions.appendChild(cancelBtn);
    el.modalActions.appendChild(yesBtn);
    el.modalOverlay.classList.add("open");
  }

  function showPrompt(title, body, defaultValue, onSubmit) {
    el.modalTitle.textContent = title;
    el.modalBody.textContent = body;
    el.modalInput.style.display = "block";
    el.modalInput.value = defaultValue || "";
    el.modalActions.innerHTML = "";
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "modal-btn secondary";
    cancelBtn.textContent = "Cancel";
    cancelBtn.onclick = closeModal;
    const okBtn = document.createElement("button");
    okBtn.className = "modal-btn primary";
    okBtn.textContent = "OK";
    okBtn.onclick = () => {
      const val = el.modalInput.value;
      closeModal();
      onSubmit(val);
    };
    el.modalActions.appendChild(cancelBtn);
    el.modalActions.appendChild(okBtn);
    el.modalOverlay.classList.add("open");
    setTimeout(() => el.modalInput.focus(), 50);
  }

  // ---------- Rendering ----------
  function renderGoalsList() {
    el.goalsBox.innerHTML = "";
    state.goals.forEach((goal, i) => {
      const isChecked = !!state.checked[i];

      const row = document.createElement("div");
      row.className = "goal-row" + (isChecked ? " checked" : "");

      const icon = document.createElement("div");
      icon.className = "goal-icon";
      icon.textContent = goal.icon;

      const textFrame = document.createElement("div");
      textFrame.className = "goal-text-frame";

      const title = document.createElement("span");
      title.className = "goal-title";
      title.textContent = goal.text;
      textFrame.appendChild(title);

      if (goal.sub) {
        const sub = document.createElement("span");
        sub.className = "goal-sub";
        sub.textContent = goal.sub;
        textFrame.appendChild(sub);
      }

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "goal-checkbox";
      checkbox.checked = isChecked;
      checkbox.addEventListener("click", (e) => e.stopPropagation());
      checkbox.addEventListener("change", () => {
        state.checked[i] = checkbox.checked;
        onBoxClicked();
      });

      const del = document.createElement("div");
      del.className = "goal-delete";
      del.textContent = "✖";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteGoal(i);
      });

      row.appendChild(icon);
      row.appendChild(textFrame);
      row.appendChild(checkbox);
      row.appendChild(del);

      row.addEventListener("click", () => {
        checkbox.checked = !checkbox.checked;
        state.checked[i] = checkbox.checked;
        onBoxClicked();
      });

      el.goalsBox.appendChild(row);
    });
  }

  function onBoxClicked() {
    updateFace(true);
    renderGoalsList();
  }

  function updateFace(playSound) {
    const total = state.checked.length;
    if (total === 0) return;

    const checkedCount = state.checked.filter(Boolean).length;
    const percent = Math.round((checkedCount / total) * 100);
    el.progressLabel.textContent = `${checkedCount} of ${total} completed (${percent}%)`;

    const justUnlocked = (checkedCount === total && !state.isGoldMode);

    if (checkedCount === total) {
      el.emojiLabel.textContent = "🤩";
      el.messageLabel.textContent = "🎉 Perfect Day unlocked! You did it! 🎉";
      el.messageLabel.style.color = "#92400e";
      el.mainTitle.textContent = "✨ PERFECT DAY UNLOCKED! ✨";
      turnGoldMode(true);
      startSparkles();

      const todayIso = new Date().toISOString().slice(0, 10);
      if (state.lastPerfectDate !== todayIso) {
        state.streakCount += 1;
        state.lastPerfectDate = todayIso;
        el.streakBadge.textContent = `🔥 ${state.streakCount} Day Streak`;
      }

      if (justUnlocked && playSound) playChime();

    } else if (checkedCount >= Math.max(2, Math.floor(total * 0.65))) {
      el.emojiLabel.textContent = "😃";
      el.messageLabel.textContent = "Almost there! You are doing so awesome!";
      el.messageLabel.style.color = "#16a34a";
      el.mainTitle.textContent = "✨ PERFECT DAY ✨";
      turnGoldMode(false);
    } else if (checkedCount >= Math.max(1, Math.floor(total * 0.33))) {
      el.emojiLabel.textContent = "🙂";
      el.messageLabel.textContent = "Good job! Keep going with your day!";
      el.messageLabel.style.color = "#0284c7";
      el.mainTitle.textContent = "✨ PERFECT DAY ✨";
      turnGoldMode(false);
    } else {
      el.emojiLabel.textContent = "😐";
      el.messageLabel.textContent = "Check off your goals to make me happy!";
      el.messageLabel.style.color = "#64748b";
      el.mainTitle.textContent = "✨ PERFECT DAY ✨";
      turnGoldMode(false);
    }

    el.emojiLabel.classList.remove("pop");
    void el.emojiLabel.offsetWidth;
    el.emojiLabel.classList.add("pop");
  }

  function turnGoldMode(isGold) {
    state.isGoldMode = isGold;
    document.body.classList.toggle("gold-mode", isGold);
    if (!isGold) {
      stopSparkles();
      el.sparkleLabel.textContent = "";
    }
  }

  function startSparkles() {
    stopSparkles();
    state.sparkleStep = 0;
    function tick() {
      el.sparkleLabel.textContent = SPARKLE_PATTERNS[state.sparkleStep % SPARKLE_PATTERNS.length];
      state.sparkleStep += 1;
      state.sparkleTimer = setTimeout(tick, 400);
    }
    tick();
  }

  function stopSparkles() {
    if (state.sparkleTimer) {
      clearTimeout(state.sparkleTimer);
      state.sparkleTimer = null;
    }
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch (e) { /* ignore if audio isn't available */ }
  }

  function shuffleQuote() {
    const options = QUOTES.filter(q => q !== state.currentQuote);
    state.currentQuote = options[Math.floor(Math.random() * options.length)];
    el.quoteLabel.textContent = state.currentQuote;
  }

  function promptAddGoal() {
    showPrompt("Add Goal", "What daily goal do you want to add?", "", (goalText) => {
      if (!goalText || !goalText.trim()) return;
      showPrompt("Goal Emoji", "Choose an emoji for this goal (e.g. 🧘, 🎸, 🍎):", "⭐", (icon) => {
        if (!icon || !icon.trim()) icon = "⭐";
        state.goals.push({ icon: icon.trim(), text: goalText.trim(), sub: "Custom daily ritual" });
        state.checked.push(false);
        renderGoalsList();
        updateFace(false);
      });
    });
  }

  function deleteGoal(index) {
    if (state.goals.length <= 1) {
      showInfo("Notice", "You need at least 1 goal in your list!");
      return;
    }
    const goalTitle = state.goals[index].text;
    showConfirm("Remove Goal", `Remove '${goalTitle}' from your daily list?`, () => {
      state.goals.splice(index, 1);
      state.checked.splice(index, 1);
      renderGoalsList();
      updateFace(false);
    });
  }

  function checkMyDay() {
    const checkedCount = state.checked.filter(Boolean).length;
    const total = state.checked.length;
    const gratitudeText = el.gratitudeEntry.value.trim();

    if (checkedCount === total) {
      playChime();
      let msg = `🎉 PERFECT DAY ACHIEVED! 🎉\n\n` +
        `You finished all ${total} goals today!\n` +
        `🔥 Current Streak: ${state.streakCount} Consecutive Perfect Days!\n`;
      if (gratitudeText) {
        msg += `\n💛 Gratitude today: "${gratitudeText}"\n`;
      }
      msg += `\nEnjoy your peaceful, triumphant evening! 🤩`;
      showInfo("Check My Day 🌟", msg);
    } else {
      const missing = state.goals
        .map((g, i) => (!state.checked[i] ? `• ${g.icon} ${g.text}` : null))
        .filter(Boolean)
        .join("\n");
      const msg = `You completed ${checkedCount} of ${total} goals so far!\n\n` +
        `Here are the goals you still need to complete:\n\n${missing}\n\n` +
        `🔥 Current Streak: ${state.streakCount} Days\n\n` +
        `You can do it! 💪`;
      showInfo("Check My Day 📋", msg);
    }
  }

  function resetGoals() {
    showConfirm("Reset Day", "Start a fresh new day?", () => {
      state.checked = state.checked.map(() => false);
      renderGoalsList();
      updateFace(false);
    });
  }

  // ---------- Init ----------
  function init() {
    const today = new Date();
    const dateStr = today.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    el.dateLabel.textContent = `📅 ${dateStr}`;
    el.quoteLabel.textContent = state.currentQuote;
    el.streakBadge.textContent = `🔥 ${state.streakCount} Day Streak`;

    renderGoalsList();
    updateFace(false);

    el.btnQuote.addEventListener("click", shuffleQuote);
    el.btnAddGoal.addEventListener("click", promptAddGoal);
    el.checkBtn.addEventListener("click", checkMyDay);
    el.resetBtn.addEventListener("click", resetGoals);
    el.modalOverlay.addEventListener("click", (e) => {
      if (e.target === el.modalOverlay) closeModal();
    });
  }

  init();
})();
</script>

</body>
